server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline hardening. Note: nginx does not inherit add_header into a
    # location that declares its own, so the cache rules below deliberately use
    # `expires` rather than add_header and leave these inherited.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS is not set here on purpose. TLS terminates at the proxy in front of
    # this container (Dokploy/Traefik), so that is where it belongs.

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    # text/html is already in nginx's default gzip_types, so listing it here
    # raises a "duplicate MIME type" warning at startup. Leave it out.
    gzip_types text/css application/javascript application/json
               image/svg+xml application/xml;

    # Static assets. Filenames are not content-hashed yet, so keep the cache
    # modest: raise to 1y and add immutable once they are.
    location /assets/ { expires 7d; }

    location = /robots.txt  { expires 1d; }
    location = /sitemap.xml { expires 1d; }

    # Real 404s. Do NOT add an SPA fallback here: answering 200 for a missing
    # page is a soft 404 and it harms indexing.
    location / {
        try_files $uri $uri/ =404;
    }
}
